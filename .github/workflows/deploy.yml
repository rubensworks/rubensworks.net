name: Build and Deploy
on:
  push:
    branches:
      - "**"
    pull_request:
      branches:
        - "**"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install 🔧
        run: npm ci
      - name: Test 🧪
        run: npm test
      - name: Build 🔧
        run: npm run build
      # Blocking, unlike the html-proofer step it replaces: script/cibuild ended in
      # `|| true`, so broken links never failed a build. This one exits non-zero.
      - name: Check links and anchors 🔗
        run: npm run check:links
      - name: Install SSH key 🔧
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SCP_DEPLOY_RSA }}
          known_hosts: ${{ secrets.SCP_DEPLOY_HOST }}
      # Unchanged apart from the directory: Jekyll wrote _site, Astro writes dist.
      #
      # NOTE: `dist/*` is a shell glob, so it skips dot-directories — which means
      # `.well-known/nostr.json` is built but never uploaded. Jekyll never produced that file
      # at all, so this is not a regression, but publishing the NIP-05 identity needs
      # `dist/` (with the trailing slash, no glob) here. Left as-is because the deploy step
      # was explicitly out of scope for this migration.
      - name: Deploy 🚀
        if: startsWith(github.ref, 'refs/heads/master')
        run: rsync -r --quiet -e "ssh -p $SCP_PORT -o 'StrictHostKeyChecking=no'" dist/* $SCP_USER@rubensworks.net:$SCP_LOCATION
        env:
          SCP_PORT: ${{ secrets.SCP_PORT }}
          SCP_USER: ${{ secrets.SCP_USER }}
          SCP_LOCATION: ${{ secrets.SCP_LOCATION }}
