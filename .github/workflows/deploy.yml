name: Build and Deploy
on:
  push:
    branches:
      - "**"
    pull_request:
      branches:
        - "**"
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install 🔧
        run: npm ci
      - name: Test 🧪
        run: npm test
      # Adds an entry to every input file, then checks the suite still passes and the new
      # content actually reaches its pages. Builds into its own directory and restores
      # everything afterwards, so it leaves nothing behind for the deploy to pick up.
      #
      # Runs before the build on purpose: it is the one step that edits the inputs, so the
      # artifact the deploy uploads is produced *after* it and cannot be affected by it.
      - name: Check content can be added 📄
        run: npm run check:content
      - name: Check images are optimised 🖼️
        run: npm run check:images
      - name: Build 🔧
        run: npm run build
      # Blocking, unlike the html-proofer step it replaces: script/cibuild ended in
      # `|| true`, so broken links never failed a build. This one exits non-zero.
      - name: Check links and anchors 🔗
        run: npm run check:links
      # Unique titles and descriptions, canonical URLs, one <main>, sized images with alt
      # text, and a sitemap that lists every page. Blocking, like the link check.
      - name: Check metadata and sitemap 🔍
        run: npm run check:seo
      - name: Install SSH key 🔧
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SCP_DEPLOY_RSA }}
          known_hosts: ${{ secrets.SCP_DEPLOY_HOST }}
      # NOTE: `dist/*` is a shell glob, so it skips dot-directories — which means
      # `.well-known/nostr.json` is built but never uploaded. Publishing the NIP-05 identity
      # needs `dist/` here, with the trailing slash and no glob.
      - name: Deploy 🚀
        if: startsWith(github.ref, 'refs/heads/master')
        run: rsync -r --quiet -e "ssh -p $SCP_PORT -o 'StrictHostKeyChecking=no'" dist/* $SCP_USER@rubensworks.net:$SCP_LOCATION
        env:
          SCP_PORT: ${{ secrets.SCP_PORT }}
          SCP_USER: ${{ secrets.SCP_USER }}
          SCP_LOCATION: ${{ secrets.SCP_LOCATION }}
